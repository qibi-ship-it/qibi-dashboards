// ── Format helpers ──
function fmt(n) { return n.toLocaleString('en-CH'); }
function fmtD(n, d) { return n.toFixed(d); }
function fmtPct(n) { return n.toFixed(1) + '%'; }
function deltaClass(n) { return n <= 0 ? 'delta-pos' : 'delta-neg'; }

function getWeekMonday(wk) {
  var parts = wk.split('-W');
  var year = parseInt(parts[0]);
  var week = parseInt(parts[1]);
  var jan4 = new Date(year, 0, 4);
  var dow = jan4.getDay() || 7;
  var w1Mon = new Date(year, 0, 4 - dow + 1);
  var target = new Date(w1Mon.getTime() + (week - 1) * 7 * 86400000);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[target.getMonth()] + ' ' + target.getDate();
}

function getMatchingWeekLastYear(wk) {
  var p = wk.split('-W');
  return (parseInt(p[0]) - 1) + '-W' + p[1];
}

var currentMode = 'sequential';
var sortCol = null;
var sortDir = 'desc';

// ── Checkbox panel helpers (EXACT same pattern as Sales) ──
function _togglePanel(id) { document.getElementById(id).classList.toggle('open'); }
function _selectAll(cls) { document.querySelectorAll('.' + cls).forEach(function(cb) { cb.checked = true; }); }
function _deselectAll(cls) { document.querySelectorAll('.' + cls).forEach(function(cb) { cb.checked = false; }); }
function _getSelected(cls) {
  var all = document.querySelectorAll('.' + cls);
  var checked = document.querySelectorAll('.' + cls + ':checked');
  if (checked.length === 0 || checked.length === all.length) return null;
  var out = [];
  checked.forEach(function(cb) { out.push(cb.value); });
  return out;
}

// Location panel
function toggleLocPanel() { _togglePanel('locPanel'); }
function locSelectAll() { _selectAll('loc-cb'); updateLocBtn(); render(); }
function locDeselectAll() { _deselectAll('loc-cb'); updateLocBtn(); render(); }

function updateLocBtn() {
  var all = document.querySelectorAll('.loc-cb');
  var checked = document.querySelectorAll('.loc-cb:checked');
  var btn = document.getElementById('locBtn');
  if (checked.length === 0 || checked.length === all.length) {

  }
}
function getSelectedLocs() { return _getSelected('loc-cb'); }

document.addEventListener('click', function(e) {

function setMode(el) {
  document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
  el.classList.add('active');
  currentMode = el.getAttribute('data-mode');
  sortCol = null;
  sortDir = 'desc';
  render();
}

function toggleSort(colIdx) {
  if (sortCol === colIdx) {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  } else {
    sortCol = colIdx;
    sortDir = 'desc';
  }
  render();
}

// ── Data extraction helpers ──
function getRefundVal(d, refundType) {
  if (!d) return 0;
  if (refundType === 'auto') return d.a || 0;
  if (refundType === 'manual') return d.m || 0;
  return d.r || 0;
}
function getSoldVal(d) { return d ? (d.s || 0) : 0; }
function getCatRefundVal(d, cats, refundType) {
  if (!d || !d.cats) return 0;
  var total = 0;
  cats.forEach(function(cat) {
    var cd = d.cats[cat];
    if (!cd) return;
    if (refundType === 'auto') total += (cd.a || 0);
    else if (refundType === 'manual') total += (cd.m || 0);
    else total += (cd.r || 0);
  });
  return total;
}
function getCatSoldVal(d, cats) {
  if (!d || !d.cats) return 0;
  var total = 0;
  cats.forEach(function(cat) {
    var cd = d.cats[cat];
    if (cd) total += (cd.s || 0);
  });
  return total;
}

// ── Main render (mirrors Sales dashboard render() exactly) ──
function render() {
  var selectedCats = getSelectedCats(); // null = all
  var selectedLocs = getSelectedLocs(); // null = all
  var selectedYears = getSelectedYears(); // null = all
  var show = document.getElementById('showFilter').value;
  var metric = document.getElementById('metricFilter').value;
  var refundType = document.getElementById('refundTypeFilter').value;
  var fridgeType = document.getElementById('fridgeTypeFilter').value;
  var mode = currentMode;

  var weeks = DATA.weeks;
  var venueMap = DATA.venues;

  // Year filter
  var displayWeeks;
  if (!selectedYears) {
    displayWeeks = weeks;
  } else {
    displayWeeks = weeks.filter(function(w) { return selectedYears.indexOf(w.split('-')[0]) !== -1; });
  }

  // Helper: extract refund/sold from a week entry, respecting category filter
  function getWV(wkData) {
    if (!wkData) return {r: 0, s: 0};
    if (!selectedCats) return {r: getRefundVal(wkData, refundType), s: getSoldVal(wkData)};
    return {r: getCatRefundVal(wkData, selectedCats, refundType), s: getCatSoldVal(wkData, selectedCats)};
  }

  // Helper: get YTD totals for a venue
  function getYTD(vd) {
    var tR = 0, tS = 0;
    displayWeeks.forEach(function(w) {
      var d = vd.wk[w];
      var v = getWV(d);
      tR += v.r;
      tS += v.s;
    });
    return {r: tR, s: tS};
  }

  // Helper: get auto/manual breakdown for a venue across display weeks
  function getAutoManual(vd) {
    var a = 0, m = 0;
    displayWeeks.forEach(function(w) {
      var d = vd.wk[w];
      if (!d) return;
      if (!selectedCats) {
        a += (d.a || 0);
        m += (d.m || 0);
      } else {
        selectedCats.forEach(function(cat) {
          if (d.cats && d.cats[cat]) {
            a += (d.cats[cat].a || 0);
            m += (d.cats[cat].m || 0);
          }
        });
      }
    });
    return {a: a, m: m};
  }

  var allVenueKeys = Object.keys(venueMap);

  // ── Build venue rows ──
  var rows = [];
  allVenueKeys.forEach(function(venue) {
    var vd = venueMap[venue];
    // Location filter
    if (selectedLocs && selectedLocs.indexOf(venue) === -1) return;
    // Fridge type filter
    if (fridgeType !== 'all' && vd.ft !== fridgeType) return;

    var weekValues = [];
    var ytdR = 0, ytdS = 0;

    if (mode === 'yoy') {
      displayWeeks.forEach(function(wk) {
        var d = getWV(vd.wk[wk]);
        var lyWk = getMatchingWeekLastYear(wk);
        var lyD = getWV(vd.wk[lyWk]);
        weekValues.push({
          tyR: d.r, tyS: d.s, lyR: lyD.r, lyS: lyD.s,
          deltaR: d.r - lyD.r,
          tyPct: d.s > 0 ? (d.r / d.s * 100) : 0,
          lyPct: lyD.s > 0 ? (lyD.r / lyD.s * 100) : 0
        });
        ytdR += d.r;
        ytdS += d.s;
      });
    } else if (mode === 'cumulative') {
      var cumR = 0, cumS = 0;
      displayWeeks.forEach(function(wk) {
        var d = getWV(vd.wk[wk]);
        cumR += d.r;
        cumS += d.s;
        weekValues.push({tyR: cumR, tyS: cumS, pct: cumS > 0 ? (cumR / cumS * 100) : 0});
      });
      ytdR = cumR;
      ytdS = cumS;
    } else {
      displayWeeks.forEach(function(wk) {
        var d = getWV(vd.wk[wk]);
        weekValues.push({tyR: d.r, tyS: d.s});
        ytdR += d.r;
        ytdS += d.s;
      });
    }

    rows.push({
      venue: venue,
      ft: vd.ft,
      weekValues: weekValues,
      ytdR: ytdR,
      ytdS: ytdS,
      ytdPct: ytdS > 0 ? (ytdR / ytdS * 100) : 0,
      sortYtd: metric === 'pct' ? (ytdS > 0 ? (ytdR / ytdS * 100) : 0) : ytdR
    });
  });

  // ── Top/bottom filter ──
  if (show === 'top10') {
    rows.sort(function(a, b) { return b.sortYtd - a.sortYtd; });
    rows = rows.slice(0, 10);
  } else if (show === 'bottom10') {
    rows.sort(function(a, b) { return a.sortYtd - b.sortYtd; });
    rows = rows.slice(0, 10);
  }

  // ── Column sorting ──
  if (sortCol !== null) {
    rows.sort(function(a, b) {
      var va, vb;
      if (sortCol === 0) {
        va = a.venue.toLowerCase(); vb = b.venue.toLowerCase();
        return sortDir === 'asc' ? (va < vb ? -1 : 1) : (va > vb ? -1 : 1);
      }
      if (sortCol === displayWeeks.length + 1) {
        va = a.sortYtd; vb = b.sortYtd;
      } else {
        var idx = sortCol - 1;
        if (idx < 0 || idx >= a.weekValues.length) return 0;
        var wa = a.weekValues[idx], wb = b.weekValues[idx];
        if (metric === 'pct') {
          va = wa.tyS > 0 ? (wa.tyR / wa.tyS * 100) : 0;
          vb = wb.tyS > 0 ? (wb.tyR / wb.tyS * 100) : 0;
        } else {
          va = wa.tyR; vb = wb.tyR;
        }
      }
      return sortDir === 'desc' ? vb - va : va - vb;
    });
  }

  // ── Compute Global Total ──
  var globalWV = [];
  displayWeeks.forEach(function(wk, wi) {
    var gR = 0, gS = 0;
    rows.forEach(function(r) { gR += r.weekValues[wi].tyR; gS += r.weekValues[wi].tyS; });
    globalWV.push({tyR: gR, tyS: gS});
  });
  var globalYtdR = 0, globalYtdS = 0;
  rows.forEach(function(r) { globalYtdR += r.ytdR; globalYtdS += r.ytdS; });

  // ── Compute Avg per Location ──
  var avgWV = [];
  displayWeeks.forEach(function(wk, wi) {
    var activeCount = 0;
    rows.forEach(function(r) { if (r.weekValues[wi].tyR > 0 || r.weekValues[wi].tyS > 0) activeCount++; });
    var g = globalWV[wi];
    var div = activeCount || 1;
    avgWV.push({
      tyR: g.tyR / div,
      tyS: g.tyS / div,
      pct: g.tyS > 0 ? (g.tyR / g.tyS * 100) : 0,
      active: activeCount
    });
  });
  var avgYtdActive = rows.length || 1;

  // ── Summary cards (auto/manual breakdown — category + location aware) ──
  var totalAutoCount = 0, totalManualCount = 0;
  rows.forEach(function(r) {
    var am = getAutoManual(venueMap[r.venue]);
    totalAutoCount += am.a;
    totalManualCount += am.m;
  });
  var totalRefundCount = globalYtdR;
  var totalRefundPct = globalYtdS > 0 ? (globalYtdR / globalYtdS * 100) : 0;

  var cardsHtml = '<div class="summary-cards">' +
    '<div class="summary-card"><div class="label">Items Sold</div><div class="value">' + fmt(globalYtdS) + '</div><div class="sub">' + rows.length + ' locations</div></div>' +
    '<div class="summary-card"><div class="label">Refunds</div><div class="value red">' + fmt(totalRefundCount) + '</div><div class="sub">' + fmtPct(totalRefundPct) + ' of sold</div></div>' +
    '<div class="summary-card"><div class="label">Automatic</div><div class="value">' + fmt(totalAutoCount) + '</div><div class="sub">' + (totalAutoCount + totalManualCount > 0 ? fmtPct(totalAutoCount / (totalAutoCount + totalManualCount) * 100) : '—') + ' of refunds</div></div>' +
    '<div class="summary-card"><div class="label">Manual</div><div class="value">' + fmt(totalManualCount) + '</div><div class="sub">' + (totalAutoCount + totalManualCount > 0 ? fmtPct(totalManualCount / (totalAutoCount + totalManualCount) * 100) : '—') + ' of refunds</div></div>' +
    '<div class="summary-card"><div class="label">Avg / Location</div><div class="value green">' + (rows.length > 0 ? fmtD(totalRefundCount / rows.length, 1) : '0') + '</div><div class="sub">refunds per location</div></div>' +
    '</div>';

  // ── Cell rendering helper ──
  function cellHtml(wv) {
    if (mode === 'sequential') {
      if (wv.tyR === 0 && wv.tyS === 0) return '<span class="dim">—</span>';
      if (metric === 'pct') {
        var p = wv.tyS > 0 ? (wv.tyR / wv.tyS * 100) : 0;
        return fmtPct(p);
      }
      return fmt(wv.tyR);
    }
    if (mode === 'yoy') {
      if (wv.tyR === 0 && wv.lyR === 0) return '<span class="dim">—</span>';
      if (wv.lyR === 0 && wv.tyR > 0) return '<span class="new-tag">NEW</span>';
      if (metric === 'pct') {
        var delta = wv.tyPct - wv.lyPct;
        var cls = deltaClass(delta);
        return '<span class="' + cls + '">' + (delta >= 0 ? '+' : '') + fmtPct(delta) + '</span>';
      }
      var d = wv.deltaR;
      var cls = deltaClass(d);
      return '<span class="' + cls + '">' + (d >= 0 ? '+' : '') + d + '</span>';
    }
    // cumulative
    if (metric === 'pct') return fmtPct(wv.pct);
    return fmt(wv.tyR);
  }

  // ── Build sort arrow helper ──
  var sa = function(ci) {
    return sortCol === ci ? (sortDir === 'asc' ? '▲' : '▼') : '⇅';
  };

  // ── Build table header ──
  var headerHtml = '<tr><th onclick="toggleSort(0)">Location <span class="sort-arrow">' + sa(0) + '</span></th>';
  displayWeeks.forEach(function(wk, i) {
    var ci = i + 1;
    var label = wk.replace(/^\d{4}-/, '');
    var dateLabel = DATA.week_dates[wk] || getWeekMonday(wk);
    headerHtml += '<th onclick="toggleSort(' + ci + ')">' + label + '<span class="week-date">' + dateLabel + '</span><span class="sort-arrow">' + sa(ci) + '</span></th>';
  });
  var ytdCI = displayWeeks.length + 1;
  headerHtml += '<th class="ytd-col" onclick="toggleSort(' + ytdCI + ')">YTD <span class="sort-arrow">' + sa(ytdCI) + '</span></th></tr>';

  var bodyHtml = '';

  // ── Avg / Location row (TOP of table, italic #888, single value) ──
  bodyHtml += '<tr class="avg-row"><td><div class="fridge-name">Avg / Location</div><div class="machine-name">' + rows.length + ' active locations</div></td>';
  avgWV.forEach(function(av) {
    if (mode === 'sequential') {
      if (metric === 'pct') {
        bodyHtml += '<td>' + fmtPct(av.pct) + ' <span style="color:#555;font-size:10px">(' + av.active + ')</span></td>';
      } else {
        bodyHtml += '<td>' + fmtD(av.tyR, 1) + ' <span style="color:#555;font-size:10px">(' + av.active + ')</span></td>';
      }
    } else {
      bodyHtml += '<td>—</td>';
    }
  });
  // AVG YTD
  if (metric === 'pct') {
    var avgYtdPct = globalYtdS > 0 ? (globalYtdR / globalYtdS * 100) : 0;
    bodyHtml += '<td class="ytd-col">' + fmtPct(avgYtdPct) + '</td>';
  } else {
    bodyHtml += '<td class="ytd-col">' + fmtD(globalYtdR / avgYtdActive, 1) + '</td>';
  }
  bodyHtml += '</tr>';

  // ── Location rows ──
  rows.forEach(function(r) {
    bodyHtml += '<tr><td><div class="fridge-name">' + r.venue + '</div><div class="machine-name">' + r.ft + '</div></td>';
    r.weekValues.forEach(function(wv) {
      bodyHtml += '<td>' + cellHtml(wv) + '</td>';
    });
    // YTD cell
    if (metric === 'pct') {
      bodyHtml += '<td class="ytd-col">' + fmtPct(r.ytdPct) + '</td>';
    } else {
      bodyHtml += '<td class="ytd-col">' + fmt(r.ytdR) + '</td>';
    }
    bodyHtml += '</tr>';
  });

  // ── Global Total row (BOTTOM, green) ──
  bodyHtml += '<tr class="global-row"><td><div class="fridge-name">Global Total</div><div class="machine-name">All ' + rows.length + ' locations</div></td>';
  globalWV.forEach(function(gv) {
    if (mode === 'sequential') {
      if (metric === 'pct') {
        var p = gv.tyS > 0 ? (gv.tyR / gv.tyS * 100) : 0;
        bodyHtml += '<td>' + fmtPct(p) + '</td>';
      } else {
        bodyHtml += '<td>' + fmt(gv.tyR) + '</td>';
      }
    } else {
      bodyHtml += '<td>—</td>';
    }
  });
  // Global YTD
  if (metric === 'pct') {
    var gPct = globalYtdS > 0 ? (globalYtdR / globalYtdS * 100) : 0;
    bodyHtml += '<td class="ytd-col">' + fmtPct(gPct) + '</td>';
  } else {
    bodyHtml += '<td class="ytd-col">' + fmt(globalYtdR) + '</td>';
  }
  bodyHtml += '</tr>';

  // ── Assemble into mainContent ──
  document.getElementById('mainContent').innerHTML = cardsHtml +
    '<div class="table-wrap"><table><thead>' + headerHtml + '</thead><tbody>' + bodyHtml + '</tbody></table></div>';

  // Freeze panes: set avg-row sticky top to actual thead height
  requestAnimationFrame(function() {
    var th = document.querySelector('.table-wrap thead');
    if (th) {
      var h = th.offsetHeight;
      document.querySelectorAll('.avg-row td').forEach(function(td) { td.style.top = h + 'px'; });
    }
  });
}

// ── Export CSV ──
function exportCSV() {
  var selectedYears = getSelectedYears();
  var selectedCats = getSelectedCats();
  var selectedLocs = getSelectedLocs();
  var refundType = document.getElementById('refundTypeFilter').value;
  var fridgeType = document.getElementById('fridgeTypeFilter').value;
  var weeks = DATA.weeks;
  var displayWeeks = !selectedYears ? weeks : weeks.filter(function(w) { return selectedYears.indexOf(w.split('-')[0]) !== -1; });

  var csvRows = [];
  var header = ['Location', 'Fridge Type'];
  displayWeeks.forEach(function(w) { header.push(w + ' Refunds'); header.push(w + ' Sold'); header.push(w + ' %'); });
  header.push('YTD Refunds'); header.push('YTD Sold'); header.push('YTD %');
  csvRows.push(header.join(','));

  Object.keys(DATA.venues).sort().forEach(function(v) {
    var vd = DATA.venues[v];
    if (selectedLocs && selectedLocs.indexOf(v) === -1) return;
    if (fridgeType !== 'all' && vd.ft !== fridgeType) return;
    var cols = ['"' + v.replace(/"/g, '""') + '"', vd.ft];
    var tR = 0, tS = 0;
    displayWeeks.forEach(function(w) {
      var d = vd.wk[w];
      var sold, refunds;
      if (!selectedCats) { sold = getSoldVal(d); refunds = getRefundVal(d, refundType); }
      else { sold = getCatSoldVal(d, selectedCats); refunds = getCatRefundVal(d, selectedCats, refundType); }
      var pct = sold > 0 ? (refunds / sold * 100).toFixed(1) : '0.0';
      cols.push(refunds); cols.push(sold); cols.push(pct + '%');
      tR += refunds; tS += sold;
    });
    cols.push(tR); cols.push(tS); cols.push(tS > 0 ? (tR/tS*100).toFixed(1) + '%' : '0.0%');
    csvRows.push(cols.join(','));
  });

  var blob = new Blob([csvRows.join('\n')], {type: 'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'refund_analysis.csv';
  a.click();
}

render();
</script>
