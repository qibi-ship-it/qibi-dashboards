<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QiBi — Refund Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0a0a0a;color:#fff;font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.5;display:flex;flex-direction:column}

/* HEADER */
.header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid #1a1a1a;flex-shrink:0}
.header img{height:28px}
.header h1{font-size:18px;font-weight:600;color:#fff}
.header .subtitle{font-size:12px;color:#555;margin-left:auto;margin-right:12px}
.back-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;background:#111;border:1px solid #1a1a1a;border-radius:10px;color:#20ff00;font-size:12px;font-family:Inter,sans-serif;text-decoration:none;transition:border-color 0.15s}
.back-btn:hover{border-color:#20ff00}
.back-btn svg{width:14px;height:14px}

/* SUMMARY CARDS */
.summary-cards{display:flex;gap:10px;padding:12px 24px;flex-wrap:wrap;flex-shrink:0}
.card{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:14px 18px;min-width:140px;flex:1}
.card .label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.card .value{font-size:22px;font-weight:700;color:#fff}
.card .value.green{color:#20ff00}
.card .value.red{color:#ff4444}
.card .sub{font-size:10px;color:#555;margin-top:1px}

/* CONTROLS BAR */
.controls{display:flex;gap:10px;padding:10px 24px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1a1a1a;flex-shrink:0}
.filter-group{position:relative;display:flex;align-items:center;gap:5px}
.filter-group .lbl{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:0.5px}
.btn{background:#111;border:1px solid #1a1a1a;color:#fff;padding:5px 11px;border-radius:8px;font-size:11px;cursor:pointer;font-family:Inter,sans-serif;transition:all 0.15s;white-space:nowrap}
.btn:hover{border-color:#333}
.btn.active{border-color:#20ff00;color:#20ff00}
select.ctrl{background:#111;border:1px solid #1a1a1a;color:#fff;padding:5px 10px;border-radius:8px;font-size:11px;font-family:Inter,sans-serif;cursor:pointer}
select.ctrl:focus{outline:none;border-color:#20ff00}

/* VIEW PILLS */
.view-pills{display:flex;gap:0;margin-left:6px}
.view-pills .pill{background:#111;border:1px solid #1a1a1a;color:#555;padding:5px 12px;font-size:11px;cursor:pointer;font-family:Inter,sans-serif;transition:all 0.15s}
.view-pills .pill:first-child{border-radius:8px 0 0 8px}
.view-pills .pill:last-child{border-radius:0 8px 8px 0}
.view-pills .pill:not(:first-child){border-left:none}
.view-pills .pill.active{background:#20ff00;color:#0a0a0a;border-color:#20ff00;font-weight:600}

/* CHECKBOX DROPDOWN */
.cb-dropdown{position:absolute;top:100%;left:0;margin-top:4px;background:#111;border:1px solid #1a1a1a;border-radius:10px;padding:8px;z-index:200;display:none;min-width:240px;max-height:320px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.cb-dropdown.show{display:block}
.cb-dropdown .cb-actions{display:flex;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #1a1a1a}
.cb-dropdown .cb-actions button{background:none;border:none;color:#20ff00;font-size:10px;cursor:pointer;font-family:Inter,sans-serif;padding:2px 4px}
.cb-dropdown .cb-actions button:hover{text-decoration:underline}
.cb-dropdown label{display:flex;align-items:center;gap:6px;font-size:11px;color:#ccc;cursor:pointer;padding:3px 4px;border-radius:4px;white-space:nowrap}
.cb-dropdown label:hover{background:#1a1a1a}
.cb-dropdown input[type=checkbox]{accent-color:#20ff00;width:14px;height:14px;cursor:pointer}

/* TABLE AREA */
.table-area{flex:1;overflow:hidden;display:flex;flex-direction:column;margin:0 24px 16px;border:1px solid #1a1a1a;border-radius:14px;background:#0d0d0d}
.table-wrap{flex:1;overflow:auto;position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:auto}
th,td{padding:5px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* HEADER ROW */
thead th{position:sticky;top:0;background:#0d0d0d;z-index:20;border-bottom:2px solid #1a1a1a;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:0.5px;text-align:right;cursor:pointer;user-select:none}
thead th:first-child{text-align:left;position:sticky;left:0;z-index:30;min-width:200px;background:#0d0d0d}
thead th:last-child{position:sticky;right:0;z-index:30;background:#0d0d0d;box-shadow:-2px 0 8px rgba(0,0,0,0.4)}
thead th:hover{color:#20ff00}
thead th .wd{display:block;font-size:9px;color:#333;font-weight:400;text-transform:none;letter-spacing:0}
thead th .sort-arrow{font-size:8px;margin-left:2px;color:#20ff00}

/* AVG ROW — sticky below header */
.avg-row td{position:sticky;z-index:15;background:#111;font-weight:600;color:#20ff00;border-bottom:2px solid #1a1a1a;font-size:12px}
.avg-row td:first-child{position:sticky;left:0;z-index:25;background:#111}
.avg-row td:last-child{position:sticky;right:0;z-index:25;background:#111;box-shadow:-2px 0 8px rgba(0,0,0,0.4)}

/* DATA ROWS */
td{text-align:right;border-bottom:1px solid #111;font-size:12px}
td:first-child{text-align:left;font-weight:500;color:#fff;position:sticky;left:0;background:#0d0d0d;z-index:5;min-width:200px}
td:last-child{position:sticky;right:0;background:#0d0d0d;z-index:5;box-shadow:-2px 0 8px rgba(0,0,0,0.4);font-weight:600}
tr:hover td{background:#111}
tr:hover td:first-child{background:#111}
tr:hover td:last-child{background:#111}
.avg-row:hover td,.avg-row:hover td:first-child,.avg-row:hover td:last-child{background:#111}

/* TOTAL ROW */
.total-row td{background:#0d0d0d;border-top:2px solid #20ff00;font-weight:700;color:#20ff00;font-size:12px}
.total-row td:first-child{background:#0d0d0d}
.total-row td:last-child{background:#0d0d0d}

/* CELL STYLES */
.dim{color:#333}
.refund-count{font-weight:600;color:#fff}
.refund-pct{font-size:10px;color:#555;margin-left:3px}
.refund-pct.high{color:#ff4444}
.refund-pct.med{color:#ffaa00}
.delta-pos{color:#20ff00}
.delta-neg{color:#ff4444}
.new-tag{font-size:9px;background:#20ff00;color:#0a0a0a;padding:1px 4px;border-radius:3px;font-weight:600;margin-left:3px}
.venue-ft{font-size:9px;color:#333;margin-left:4px;font-weight:400}
.export-btn{margin-left:auto}
</style>
</head>

var viewMode = "seq"; // seq | yoy | cum
var sortCol = null, sortDir = 1;

// ========== DROPDOWN HELPERS ==========
function toggleDD(id) {
  var dd = document.getElementById(id);
  // Close all others first
  document.querySelectorAll(".cb-dropdown").forEach(function(d) {
    if (d.id !== id) d.classList.remove("show");
  });
  dd.classList.toggle("show");
}
document.addEventListener("click", function(e) {
  if (!e.target.closest(".filter-group")) {
    document.querySelectorAll(".cb-dropdown").forEach(function(d) { d.classList.remove("show"); });
  }
});

function buildCheckboxDD(containerId, btnId, items, allLabel) {
  var box = document.getElementById(containerId);
  box.innerHTML = "";
  // Actions row
  var actions = document.createElement("div");
  actions.className = "cb-actions";
  actions.innerHTML = '<button onclick="cbSelectAll(\'' + containerId + '\',true)">Select All</button><button onclick="cbSelectAll(\'' + containerId + '\',false)">Deselect All</button>';
  box.appendChild(actions);
  // Items
  items.forEach(function(item) {
    var lb = document.createElement("label");
    lb.innerHTML = '<input type="checkbox" checked value="' + item.replace(/"/g, "&quot;") + '" onchange="cbUpdate(\'' + containerId + '\',\'' + btnId + '\',\'' + allLabel + '\');render()"> ' + item;
    box.appendChild(lb);
  });
}

function cbSelectAll(containerId, checked) {
  document.querySelectorAll("#" + containerId + " input[type=checkbox]").forEach(function(cb) { cb.checked = checked; });
  // Find associated button — derive btnId from containerId
  var btnId = containerId.replace("DD", "Btn");
  var allLabel = containerId === "yearDD" ? "All Years" : containerId === "catDD" ? "All Categories" : "All Locations";
  cbUpdate(containerId, btnId, allLabel);
  render();
}

function cbUpdate(containerId, btnId, allLabel) {
  var cbs = document.querySelectorAll("#" + containerId + " input[type=checkbox]");
  var total = cbs.length, checked = 0;
  cbs.forEach(function(cb) { if (cb.checked) checked++; });
  var btn = document.getElementById(btnId);
  if (checked === total) btn.textContent = allLabel;
  else if (checked === 0) btn.textContent = "None";
  else btn.textContent = checked + " of " + total;
}

function getChecked(containerId) {
  var sel = [];
  document.querySelectorAll("#" + containerId + " input[type=checkbox]").forEach(function(cb) {
    if (cb.checked) sel.push(cb.value);
  });
  return sel;
}

// ========== VIEW MODE ==========
function setView(mode, el) {
  viewMode = mode;
  sortCol = null; sortDir = 1;
  document.querySelectorAll(".view-pills .pill").forEach(function(p) { p.classList.remove("active"); });
  el.classList.add("active");
  render();
}

// ========== DATA HELPERS ==========
function getFilteredWeeks() {
  var years = getChecked("yearDD");
  if (years.length === 0) return [];
  return DATA.weeks.filter(function(w) { return years.indexOf(w.substring(0,4)) >= 0; });
}

function getRefundVal(d, refundType) {
  if (!d) return 0;
  if (refundType === "auto") return d.a || 0;
  if (refundType === "manual") return d.m || 0;
  return d.r || 0;
}

function getSoldVal(d) { return d ? (d.s || 0) : 0; }

function getCatRefundVal(d, cats, refundType) {
  if (!d || !d.cats) return 0;
  var total = 0;
  cats.forEach(function(cat) {
    var cd = d.cats[cat];
    if (!cd) return;
    if (refundType === "auto") total += (cd.a || 0);
    else if (refundType === "manual") total += (cd.m || 0);
    else total += (cd.r || 0);
  });
  return total;
}

function getCatSoldVal(d, cats) {
  if (!d || !d.cats) return 0;
  var total = 0;
  cats.forEach(function(cat) {
    var cd = d.cats[cat];
    if (cd) total += (cd.s || 0);
  });
  return total;
}

// ========== FORMAT ==========
function fmt(n) { return n.toLocaleString("en-CH"); }
function fmtD(n, d) { return n.toFixed(d); }
function fmtPct(n) { return n.toFixed(1) + "%"; }
function pctCls(p) { return p >= 5 ? "high" : p >= 3 ? "med" : ""; }

// ========== RENDER ==========
function render() {
  var weeks = getFilteredWeeks();
  var selLocs = getChecked("locDD");
  var selCats = getChecked("catDD");
  var allCatsSelected = selCats.length === DATA.cats.length;
  var metric = document.getElementById("metricFilter").value;
  var refundType = document.getElementById("refundTypeFilter").value;
  var fridgeType = document.getElementById("fridgeTypeFilter").value;
  var showFilter = document.getElementById("showFilter").value;

  // Filter venues
  var venues = selLocs.filter(function(v) {
    if (!DATA.venues[v]) return false;
    if (fridgeType !== "all" && DATA.venues[v].ft !== fridgeType) return false;
    return true;
  });

  // Compute per-venue, per-week values
  var rows = [];
  venues.forEach(function(venue) {
    var vd = DATA.venues[venue];
    var cells = [];
    var ytdR = 0, ytdS = 0;

    weeks.forEach(function(w) {
      var d = vd.wk[w];
      var refunds, sold;
      if (allCatsSelected) {
        refunds = getRefundVal(d, refundType);
        sold = getSoldVal(d);
      } else {
        refunds = getCatRefundVal(d, selCats, refundType);
        sold = getCatSoldVal(d, selCats);
      }
      cells.push({w: w, r: refunds, s: sold});
      ytdR += refunds;
      ytdS += sold;
    });

    rows.push({
      name: venue,
      ft: vd.ft,
      cells: cells,
      ytdR: ytdR,
      ytdS: ytdS,
      ytdPct: ytdS > 0 ? (ytdR / ytdS * 100) : 0
    });
  });

  // Show filter (Top/Bottom 10 by YTD refunds or pct)
  if (showFilter !== "all") {
    var sortKey = metric === "pct" ? "ytdPct" : "ytdR";
    rows.sort(function(a, b) { return b[sortKey] - a[sortKey]; });
    if (showFilter === "top10") rows = rows.slice(0, 10);
    else if (showFilter === "bot10") { rows.reverse(); rows = rows.slice(0, 10); }
  }

  // Sort
  if (sortCol) {
    rows.sort(function(a, b) {
      var va, vb;
      if (sortCol === "name") {
        va = a.name.toLowerCase(); vb = b.name.toLowerCase();
        return va < vb ? -sortDir : va > vb ? sortDir : 0;
      }
      if (sortCol === "ytd") {
        va = metric === "pct" ? a.ytdPct : a.ytdR;
        vb = metric === "pct" ? b.ytdPct : b.ytdR;
      } else {
        var ca = a.cells.find(function(c) { return c.w === sortCol; });
        var cb = b.cells.find(function(c) { return c.w === sortCol; });
        if (metric === "pct") {
          va = ca && ca.s > 0 ? (ca.r / ca.s * 100) : 0;
          vb = cb && cb.s > 0 ? (cb.r / cb.s * 100) : 0;
        } else {
          va = ca ? ca.r : 0;
          vb = cb ? cb.r : 0;
        }
      }
      return (va - vb) * sortDir;
    });

  var weekTotals = {};
  weeks.forEach(function(w) { weekTotals[w] = {r: 0, s: 0}; });
  var grandR = 0, grandS = 0;
  rows.forEach(function(row) {
    row.cells.forEach(function(c) {
      weekTotals[c.w].r += c.r;
      weekTotals[c.w].s += c.s;
    });
    grandR += row.ytdR;
    grandS += row.ytdS;
  });

  // ---- YoY helper: map week to same-ISO-week previous year ----

  }

  var venueWeekMap = {};

  requestAnimationFrame(function() {
    var thH = thead.offsetHeight;
    document.querySelectorAll(".avg-row td").forEach(function(td) { td.style.top = thH + "px"; });
  });

  // ---- SUMMARY CARDS ----
  renderSummary(grandR, grandS, nVenues, weeks);

  // ---- DATE RANGE ----
  if (weeks.length > 0) {
    document.getElementById("dateRange").textContent = DATA.week_dates[weeks[0]] + " — " + DATA.week_dates[weeks[weeks.length - 1]] + " (" + weeks.length + " weeks)";
  }
}

function renderSummary(refunds, sold, nVenues, weeks) {
  var pct = sold > 0 ? (refunds / sold * 100) : 0;

  // Compute auto/manual from filtered data
  var selLocs = getChecked("locDD");
  var fridgeType = document.getElementById("fridgeTypeFilter").value;
  var selCats = getChecked("catDD");
  var allCatsSelected = selCats.length === DATA.cats.length;
  var refundType = document.getElementById("refundTypeFilter").value;
  var autoCount = 0, manualCount = 0;
  var yearsSet = {};
  weeks.forEach(function(w) { yearsSet[w.substring(0,4)] = 1; });

  selLocs.forEach(function(v) {
    var vd = DATA.venues[v];
    if (!vd) return;
    if (fridgeType !== "all" && vd.ft !== fridgeType) return;
    weeks.forEach(function(w) {
      var d = vd.wk[w];
      if (!d) return;
      if (allCatsSelected) {
        autoCount += (d.a || 0);
        manualCount += (d.m || 0);
      } else {
        selCats.forEach(function(cat) {
          if (d.cats && d.cats[cat]) {
            autoCount += (d.cats[cat].a || 0);
            manualCount += (d.cats[cat].m || 0);
          }
        });
      }
    });
  });

  var cards = document.getElementById("summaryCards");
  cards.innerHTML = '<div class="card"><div class="label">Items Sold</div><div class="value">' + fmt(sold) + '</div><div class="sub">' + nVenues + ' locations</div></div>'
    + '<div class="card"><div class="label">Refunds</div><div class="value red">' + fmt(refunds) + '</div><div class="sub">' + fmtPct(pct) + ' of sold</div></div>'
    + '<div class="card"><div class="label">Automatic</div><div class="value">' + fmt(autoCount) + '</div><div class="sub">' + (autoCount + manualCount > 0 ? fmtPct(autoCount / (autoCount + manualCount) * 100) : "—") + ' of refunds</div></div>'
    + '<div class="card"><div class="label">Manual</div><div class="value">' + fmt(manualCount) + '</div><div class="sub">' + (autoCount + manualCount > 0 ? fmtPct(manualCount / (autoCount + manualCount) * 100) : "—") + ' of refunds</div></div>'
    + '<div class="card"><div class="label">Avg / Location</div><div class="value green">' + (nVenues > 0 ? fmtD(refunds / nVenues, 1) : "0") + '</div><div class="sub">refunds per location</div></div>';
}

function doSort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  render();
}

function exportCSV() {
  var weeks = getFilteredWeeks();
  var selLocs = getChecked("locDD");
  var selCats = getChecked("catDD");
  var allCatsSelected = selCats.length === DATA.cats.length;
  var metric = document.getElementById("metricFilter").value;
  var refundType = document.getElementById("refundTypeFilter").value;
  var fridgeType = document.getElementById("fridgeTypeFilter").value;

  var csvRows = [];
  var header = ["Location", "Fridge Type"];
  weeks.forEach(function(w) { header.push(w + " Refunds"); header.push(w + " Sold"); header.push(w + " %"); });
  header.push("YTD Refunds"); header.push("YTD Sold"); header.push("YTD %");
  csvRows.push(header.join(","));

  selLocs.forEach(function(v) {
    var vd = DATA.venues[v];
    if (!vd) return;
    if (fridgeType !== "all" && vd.ft !== fridgeType) return;
    var cols = ['"' + v.replace(/"/g, '""') + '"', vd.ft];
    var tR = 0, tS = 0;
    weeks.forEach(function(w) {
      var d = vd.wk[w];
      var sold, refunds;
      if (allCatsSelected) { sold = getSoldVal(d); refunds = getRefundVal(d, refundType); }
      else { sold = getCatSoldVal(d, selCats); refunds = getCatRefundVal(d, selCats, refundType); }
      var pct = sold > 0 ? (refunds / sold * 100).toFixed(1) : "0.0";
      cols.push(refunds); cols.push(sold); cols.push(pct + "%");
      tR += refunds; tS += sold;
    });
    cols.push(tR); cols.push(tS); cols.push(tS > 0 ? (tR/tS*100).toFixed(1) + "%" : "0.0%");
    csvRows.push(cols.join(","));
  });

  var blob = new Blob([csvRows.join("\n")], {type: "text/csv"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "refund_analysis.csv";
  a.click();
}

// ========== INIT ==========
function init() {
  // Year checkbox dropdown
  var yy = {};
  DATA.weeks.forEach(function(w) { yy[w.substring(0,4)] = 1; });
  buildCheckboxDD("yearDD", "yearBtn", Object.keys(yy).sort(), "All Years");

  // Category checkbox dropdown
  buildCheckboxDD("catDD", "catBtn", DATA.cats, "All Categories");

  // Location checkbox dropdown
  buildCheckboxDD("locDD", "locBtn", Object.keys(DATA.venues).sort(), "All Locations");

  render();
}

init();
</script>
